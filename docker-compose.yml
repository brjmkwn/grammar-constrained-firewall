version: '3.8'

services:
  fsm-firewall:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fsm-grammar-firewall
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=FSM Grammar-Constrained Decoding Firewall
      - MODEL_ID=qwen-2.5-7b-instruct
      - PORT=8000
      - LOG_LEVEL=INFO
      - FSM_CACHE_SIZE=256
      - ENABLE_METRICS=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
